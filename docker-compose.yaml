
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: firetrace
      POSTGRES_USER: firetrace
      POSTGRES_PASSWORD: firetrace
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firetrace -d firetrace"]
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    build: ./engine
    environment:
      WORKERS: "8"   # simulações do ensemble em paralelo (o contentor vê 8 núcleos)
    volumes:
      - ./data/jobs:/jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    shm_size: 256mb
    command: postgres -c shared_buffers=256MB -c work_mem=16MB -c max_locks_per_transaction=256
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firetrace}
      POSTGRES_USER: ${POSTGRES_USER:-firetrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firetrace}
    ports:
      - "${PORT_DB:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firetrace} -d ${POSTGRES_DB:-firetrace}"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 4s
      start_interval: 1s
    networks:
      - default

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WORKERS: "${WORKERS:-8}"   # simulações do ensemble em paralelo
    volumes:
      - ./data/jobs:/jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
      start_interval: 1s
    networks:
      - default

  # The API (controllers, services, repositories). Documentation at http://localhost:8080/swagger
  backend:
    build:
      context: .                        # repo root: carries api-spec/ and backend/
      dockerfile: backend/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      FIRETRACE_DB: Host=db;Port=5432;Database=${POSTGRES_DB:-firetrace};Username=${POSTGRES_USER:-firetrace};Password=${POSTGRES_PASSWORD:-firetrace}
      ENGINE_URL: http://engine:9000   # only used when FireTrace:Engine:Provider is "elmfire"
      FIRETRACE_JOBS: /app/data/jobs
    ports:
      - "${PORT_API:-8080}:8080"
    volumes:
      - ./locations:/app/locations:ro
      - ./data:/app/data
      - ./api-spec:/app/api-spec:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
      start_interval: 1s
    networks:
      - default

  # Loads the third-party data of a location: docker compose --profile ingest run --rm ingest --location guimaraes
  ingest:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ingest
    profiles: ["ingest"]
    environment:
      FIRETRACE_DB: Host=db;Port=5432;Database=${POSTGRES_DB:-firetrace};Username=${POSTGRES_USER:-firetrace};Password=${POSTGRES_PASSWORD:-firetrace}
    volumes:
      - ./locations:/app/locations:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  # The planning agents as a service: for every finished baseline simulation without plans it publishes plans A and B and asks for
  # their what-if runs (see agents/firetrace_agents/watcher.py for the AGENTS_* settings). No terminal needed.
  agents:
    build:
      context: ./agents                 # the root .dockerignore leaves agents/ out, so this folder is its own context
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FIRETRACE_BASE_URL: http://backend:8080/api/v1
      FIRETRACE_SPEC: /app/api-spec/openapi.json
      AGENTS_POLL_SECONDS: "${AGENTS_POLL_SECONDS:-10}"
      AGENTS_AT_MINUTE: "${AGENTS_AT_MINUTE:-0}"
      AGENTS_BUILDING_ZONES: "${AGENTS_BUILDING_ZONES:-0}"
      # LLM commander (agents/LLM_COMMANDER_PLAN.md): "llm" to let it choose the strategy of plans A and B, "rules" (default) to keep the rules.
      # The model and the key come from a local .env (git-ignored): never put the key in this file.
      AGENTS_COMMANDER: "${AGENTS_COMMANDER:-rules}"
      AGENTS_LLM_BASE_URL: "${AGENTS_LLM_BASE_URL:-https://api.openai.com/v1}"
      AGENTS_LLM_MODEL: "${AGENTS_LLM_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AGENTS_NAME: "${AGENTS_NAME:-firetrace-agents}"   # who claims the operator's plan requests (shown in the Planos tab)
      AGENTS_LLM_LOG_DIR: "${AGENTS_LLM_LOG_DIR:-/app/logs}"
      AGENTS_AUTO_PLAN: "${AGENTS_AUTO_PLAN:-0}"   # plans are made when the operator asks (a baseline is not planned on its own: saves OpenAI tokens)
      AGENTS_KEEP_ONLY_LATEST: "${AGENTS_KEEP_ONLY_LATEST:-1}"   # after a request, every older plan and what-if run is deleted
      AGENTS_SEED_DEMO: "${AGENTS_SEED_DEMO:-1}"   # on start, registers the aircraft, pre-positioned crews and reinforcements (skips what is there)
    volumes:
      - ./api-spec:/app/api-spec:ro
      - ./data/agents-logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default

  frontend:
    build:
      context: .                        # repo root: needs api-spec/ for typed client and frontend/
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080  # where nginx proxies /api/ and /swagger
    ports:
      - "${PORT_WEB:-8081}:80"          # http://localhost:8081
    volumes:
      - ./data/tiles3d:/usr/share/nginx/tiles3d:ro   # optional: photoreal 3D city tiles (tools/fetch_tiles3d.py)
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default

networks:
  default:
    name: firetrace-network

volumes:
  pgdata:

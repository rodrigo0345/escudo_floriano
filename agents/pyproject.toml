[project]
name = "firetrace-agents"
version = "0.1.0"
description = "AI planning agents for the FireTrace Coordination API: a central-command orchestrator plus firefighter agents (squad, fire truck, combat helicopter)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
firetrace-run = "firetrace_agents.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["firetrace_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
